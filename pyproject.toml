[project]
name = "fireblocks-cli"
version = "0.1.10"
description = "An unofficial CLI for managing Fireblocks services."
authors = [{ name = "Kamon Shohei", email = "cameong@stir.network" }]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "typer[all]>0.15.0",
    "toml>0.10.0",
    "tomlkit>=0.13.2,<0.14.0",
    "fireblocks-sdk>=2.16.1,<3.0.0",
    "cryptography>=48.0.1",
    "pyjwt>=2.13.0",
    "urllib3>=2.7.0",
    "requests>=2.33.0",
    "idna>=3.15",
]

[project.scripts]
fireblocks-cli = "fireblocks_cli.main:app"

[project.optional-dependencies]
dev = [
    "mypy>=1.15.0",
    "black>=26.3.1,<27.0.0",
    "pyinstaller>=6.13.0",
    "reuse>=5.0.2; python_version >= '3.9' and python_version < '4.0'",
    "pre-commit>=4.2.0",
    "build>=1.2.2.post1",
    "twine>=6.1.0",
    "pytest>=9.0.3",
    "types-toml>=0.10.8.20240310",
    "setuptools>=78.1.1",
    "filelock>=3.20.3",
    "virtualenv>=20.36.1",
    "pygments>=2.20.0",
]

[build-system]
requires = ["setuptools>=78.1.1", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["fireblocks_cli*"]
